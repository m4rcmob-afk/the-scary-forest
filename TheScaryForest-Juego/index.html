<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Scary Forest | Jugar</title>
  <style>
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; background:#06151c; color:#d8eee7; font:14px system-ui,sans-serif; }
    body { display:flex; align-items:center; justify-content:center; }
    main { width:min(100%,1280px); }
    #game { position:relative; width:100%; aspect-ratio:16/9; background:#071c26; }
    canvas { width:100%; height:100%; display:block; outline:none; }
    #loading { position:absolute; inset:0; display:grid; place-content:center; text-align:center; background:#071c26; }
    h1 { color:#9df5cb; letter-spacing:.08em; }
    progress { width:260px; height:12px; accent-color:#68e9ab; }
    footer { display:flex; gap:16px; justify-content:space-between; align-items:center; padding:12px 16px; }
    button { border:1px solid #427064; border-radius:8px; padding:9px 16px; color:#c7f8e1; background:#102d32; cursor:pointer; }
    button:disabled { opacity:.45; cursor:wait; }
    #message { color:#ffc29e; padding:12px; white-space:pre-wrap; }
    #message:empty { display:none; }
    #game:fullscreen { width:100%; height:100%; }
    @media(max-height:480px) { footer { padding:4px 10px; } }
  </style>
</head>
<body>
<main>
  <div id="game">
    <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="Forest Runner"></canvas>
    <div id="loading" role="status"><h1>FOREST RUNNER</h1><p>Preparando el bosque…</p><progress id="progress" max="1" value="0"></progress></div>
  </div>
  <footer><span>Esc / P · Pausa</span><button id="fullscreen" disabled>Pantalla completa</button></footer>
  <div id="message" role="alert"></div>
</main>
<script>
  const canvas = document.getElementById('unity-canvas');
  const message = document.getElementById('message');
  const fullscreen = document.getElementById('fullscreen');
  const config = {
    arguments: [],
    dataUrl: 'Build/BuildWeb.data.unityweb',
    frameworkUrl: 'Build/BuildWeb.framework.js.unityweb',
    codeUrl: 'Build/BuildWeb.wasm.unityweb',
    streamingAssetsUrl: 'StreamingAssets',
    fullscreenElementID: 'game',
    companyName: "DefaultCompany",
    productName: "Evaluacion2",
    productVersion: "0.1.0",
    showBanner: (text, type) => { if (type === 'error') message.textContent = text; }
  };
  const loader = document.createElement('script');
  loader.src = 'Build/BuildWeb.loader.js';
  loader.onload = () => {
    createUnityInstance(canvas, config, progress => {
      document.getElementById('progress').value = progress;
    }).then(instance => {
      document.getElementById('loading').remove();
      fullscreen.disabled = false;
      fullscreen.onclick = () => { instance.SetFullscreen(1); canvas.focus(); };
      canvas.addEventListener('pointerdown', () => canvas.focus());
      canvas.focus();
    }).catch(error => { message.textContent = 'No se pudo iniciar el juego. ' + error; });
  };
  loader.onerror = () => { message.textContent = 'No se pudo cargar el juego. Comprueba la conexión y vuelve a intentarlo.'; };
  document.body.appendChild(loader);
</script>
</body>
</html>
